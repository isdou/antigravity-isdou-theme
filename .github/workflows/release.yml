name: Publish theme release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify release version and build
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          npm run check
          node --test tests/appearance-updates.test.mjs
          node install.mjs pack
          git diff --exit-code -- core/manifest.json
      - name: Publish release and appearance assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/antigravity-isdou-theme-$GITHUB_REF_NAME.zip" dist/theme-update.json --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
